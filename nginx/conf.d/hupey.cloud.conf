# ---------------------------
# HTTP Server (port 80)
# Handles:
#   - Certbot HTTP challenges
#   - Redirects all other HTTP traffic to HTTPS
# ---------------------------
server {
    listen 80;
    server_name hupey.cloud www.hupey.cloud;

    # Certbot challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------
# HTTPS Server (port 443)
# Handles:
#   - SSL termination
#   - Proxying frontend container
# ---------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name hupey.cloud www.hupey.cloud;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/hupey.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hupey.cloud/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Fonts, images and 3D models keep their names between deploys, so cache them
    # for a day and let browsers reuse them for a week while they revalidate.
    # (Hashed /_app/immutable files already get a one-year cache from SvelteKit.)
    location ~ ^/(fonts|images|models)/|^/favicon\.png$ {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800" always;
    }

    # Proxy frontend container
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}