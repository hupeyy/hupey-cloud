# ---------------------------
# Compression for every site (http context; included before the server blocks)
# Text responses are gzipped on the fly. Responses that are already compressed
# (e.g. SvelteKit's precompressed .br/.gz assets) pass through untouched.
# ---------------------------
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain text/css text/xml text/javascript
    application/javascript application/json application/xml application/manifest+json
    application/rss+xml image/svg+xml model/gltf+json font/ttf;
