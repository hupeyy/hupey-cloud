# -------------------------
# openGym (gym.hupey.cloud)
# -------------------------
server {
    listen 80;
    server_name gym.hupey.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name gym.hupey.cloud;

    ssl_certificate /etc/letsencrypt/live/hupey.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hupey.cloud/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Custom exercise photos and videos (openGym allows up to 48m)
    client_max_body_size 50m;

    # Resolve gym-web at request time so nginx still starts if it is down
    resolver 127.0.0.11 valid=30s;
    set $gym http://gym-web:80;

    location / {
        proxy_pass $gym;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
