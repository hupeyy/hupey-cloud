<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
		<script>
			// The menu button is visible before the app's JavaScript has loaded. Remember a
			// click on it so the menu opens once it can (read in Hamburger.svelte).
			addEventListener(
				'click',
				function (e) {
					if (e.target.closest && e.target.closest('[data-menu-toggle]')) window.__menuClickedEarly = true;
				},
				true
			);
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
