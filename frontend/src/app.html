<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
		<script>
			// The menu button is visible before the app's JavaScript has loaded. Until then,
			// open and close the menu here; Hamburger.svelte takes over (and reads
			// __menuOpen) once it mounts and sets __menuReady.
			addEventListener(
				'click',
				function (e) {
					if (window.__menuReady || !e.target.closest) return;
					var toggle = e.target.closest('[data-menu-toggle]');
					if (!toggle && !e.target.closest('[data-menu-close]')) return;
					var menu = document.getElementById('site-menu');
					if (!menu) return;
					window.__menuOpen = toggle ? !window.__menuOpen : false;
					menu.setAttribute('data-open', window.__menuOpen);
					toggle = document.querySelector('[data-menu-toggle]');
					if (toggle) toggle.setAttribute('aria-expanded', window.__menuOpen);
				},
				true
			);
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
